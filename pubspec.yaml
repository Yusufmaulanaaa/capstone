name: hukumin
description: "HukumIn - AI legal consultation and lawyer matching app (front-end)."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-400.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-500.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-600.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-700.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-800.ttf
          weight: 800
